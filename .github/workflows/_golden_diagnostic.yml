# TEMPORARY diagnostic workflow (Phase 9 golden-vector drift investigation).
# Read-only: it does NOT modify tests, fixtures, tolerances, ML artifacts, or app
# code. It only measures the per-feature-error delta vs the committed golden
# vectors under several environments to establish the root cause and the
# smallest principled fix. Delete after the investigation concludes.
name: _golden-diagnostic

on:
  push:
    branches: [phase9-devsecops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare:
    name: "bare runner (py=${{ matrix.py }}, mode=${{ matrix.mode }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10.12", "3.10.21"]
        mode: ["default", "mkldnn_off"]
    env:
      MKL_CBWR: "AVX2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.py }}
      - name: Install runtime deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      -r docker/requirements-runtime.txt
      - name: Measure golden-vector delta
        run: |
          python - <<'PY'
          import os, json, platform, numpy as np, torch
          if os.environ.get("MODE") == "mkldnn_off":
              torch.backends.mkldnn.enabled = False
          print("python", platform.python_version(), "| torch", torch.__version__, "| numpy", np.__version__)
          print("cpu_cap", torch.backends.cpu.get_cpu_capability(),
                "| mkldnn", torch.backends.mkldnn.enabled,
                "| MKL_CBWR", os.environ.get("MKL_CBWR"),
                "| threads", torch.get_num_threads())
          try:
              flags = [l for l in open("/proc/cpuinfo") if l.startswith("flags")][0]
              print("avx2", " avx2 " in flags, "| avx512", "avx512" in flags, "| fma", " fma " in flags)
          except Exception as e:
              print("cpuinfo err", e)
          print("cpu:", [l.split(':',1)[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")][0])
          from ml.src.detector import TranADDetector
          d = TranADDetector.from_artifacts("ml/artifacts/swat_TranAD")
          g = json.load(open("tests/fixtures/golden_vectors.json"))
          worst = 0.0
          for c in g["cases"]:
              raw = np.array(c["raw_window"], dtype=np.float64)
              r = d.score(raw)
              fe = np.array(c["expected"]["feature_errors"], dtype=np.float64)
              ab = float(np.max(np.abs(r.feature_errors - fe)))
              rel = float(np.max(np.abs(r.feature_errors - fe) / np.maximum(np.abs(fe), 1e-30)))
              worst = max(worst, rel)
              print(f"  {c['name']:8s} feat_absmax={ab:.3e} feat_relmax={rel:.3e}")
          print("VERDICT:", "PASS(rtol=1e-5)" if worst < 1e-5 else "FAIL", "worst_rel=%.3e" % worst)
          PY

  container:
    name: "phase8a backend container (on runner)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend image (production Dockerfile)
        run: docker build -f docker/backend.Dockerfile -t ics-backend:diag .
      - name: Write golden-check script
        run: |
          cat > golden_check.py <<'PY'
          import os, json, platform, numpy as np, torch
          if os.environ.get("MODE") == "mkldnn_off":
              torch.backends.mkldnn.enabled = False
          print("python", platform.python_version(), "| torch", torch.__version__)
          print("cpu_cap", torch.backends.cpu.get_cpu_capability(),
                "| mkldnn", torch.backends.mkldnn.enabled,
                "| MKL_CBWR", os.environ.get("MKL_CBWR"))
          from ml.src.detector import TranADDetector
          d = TranADDetector.from_artifacts("ml/artifacts/swat_TranAD")
          g = json.load(open("/w/tests/fixtures/golden_vectors.json"))
          worst = 0.0
          for c in g["cases"]:
              raw = np.array(c["raw_window"], dtype=np.float64)
              r = d.score(raw)
              fe = np.array(c["expected"]["feature_errors"], dtype=np.float64)
              rel = float(np.max(np.abs(r.feature_errors - fe) / np.maximum(np.abs(fe), 1e-30)))
              worst = max(worst, rel)
              print(f"  {c['name']:8s} feat_absmax={float(np.max(np.abs(r.feature_errors-fe))):.3e} feat_relmax={rel:.3e}")
          print("VERDICT:", "PASS(rtol=1e-5)" if worst < 1e-5 else "FAIL", "worst_rel=%.3e" % worst)
          PY
      - name: Run golden-check INSIDE the container (default oneDNN)
        run: |
          docker run --rm -e MKL_CBWR=AVX2 -e OMP_NUM_THREADS=1 -e PYTHONPATH=/app \
            -v "$PWD:/w:ro" ics-backend:diag python /w/golden_check.py
      - name: Run golden-check INSIDE the container (mkldnn off + MKL_CBWR)
        run: |
          docker run --rm -e MODE=mkldnn_off -e MKL_CBWR=AVX2 -e OMP_NUM_THREADS=1 -e PYTHONPATH=/app \
            -v "$PWD:/w:ro" ics-backend:diag python /w/golden_check.py
