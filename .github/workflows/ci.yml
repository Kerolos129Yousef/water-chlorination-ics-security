# Phase 9 - CI/CD + DevSecOps security gates for the Water Chlorination ICS
# TranAD anomaly-detection service.
#
# This pipeline VALIDATES the repository before changes reach `main`. It runs
# six security/quality gates plus a real Docker build + image scan. It does NOT
# deploy, publish images, or touch the ML artifacts, threshold, or the licensed
# SWaT dataset (which is never present in CI).
#
# Fail policy (authoritative copy: docs/provenance/phase9_devsecops.md):
#   * lint      -> genuine Python errors (pyflakes F + syntax E9)
#   * tests     -> any pytest failure (dataset-gated tests skip; never fabricated)
#   * sast      -> Bandit findings at severity>=MEDIUM AND confidence>=HIGH
#   * deps      -> any pip-audit advisory except the 4 documented torch pins
#   * secrets   -> any Gitleaks detection (full history)
#   * container -> any FIXABLE HIGH/CRITICAL (unfixed base-OS CVEs reported,
#                  not blocking; 4 documented pip/setuptools-vendored exceptions)
#
# Third-party actions are pinned to immutable commit SHAs (tag in trailing
# comment). Least privilege: read-only token by default; no job needs more.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for the whole workflow. No job publishes, comments, or writes
# to the repo, so a read-only GITHUB_TOKEN is sufficient.
permissions:
  contents: read

# One run per ref; cancel superseded runs to save minutes (never affects main
# correctness because the final gate re-evaluates every required job).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  # Pinned tool versions (kept out of production requirements files on purpose).
  RUFF_VERSION: "0.16.9"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # -------------------------------------------------------------- Gate 1: lint
  lint:
    name: "Gate 1 - Code quality (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      # Fail on genuine defects only (undefined names, unused imports, bad
      # f-strings, syntax errors). We deliberately do NOT enforce cosmetic style
      # on a pre-existing codebase (no application rewrite for a new linter).
      - name: ruff check (pyflakes + syntax)
        run: ruff check --select E9,F --output-format=full backend alerting simulator ml/src tests

  # -------------------------------------------------------------- Gate 2: tests
  tests:
    name: "Gate 2 - Tests (pytest + PostgreSQL)"
    runs-on: ubuntu-latest
    # Phase 8B integration tests run against a REAL PostgreSQL 16 service using
    # ephemeral, CI-only credentials. Matches the project's postgres:16 major.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ics_alerts_test
          POSTGRES_USER: ics_app
          POSTGRES_PASSWORD: ci-ephemeral-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ics_app -d ics_alerts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Postgres suite reads this DSN; if unset it would fall back to
      # spawning its own container. We point it at the service above.
      ALERT_TEST_PG_DSN: "host=127.0.0.1 port=5432 dbname=ics_alerts_test user=ics_app password=ci-ephemeral-not-a-secret"
      # No SWaT dataset in CI: dataset-gated tests skip via the fixture guard.
      # Point at a path that cannot exist so the skip reason is explicit.
      SWAT_DATASET_DIR: "/nonexistent-swat-dataset-ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            docker/requirements-runtime.txt
            backend/requirements.txt
            ml/requirements-dev.txt
      - name: Install runtime + test dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # Production runtime pins (same manifest the image uses). CPU torch
          # index keeps the download ~200 MB instead of the ~2.5 GB CUDA build.
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r docker/requirements-runtime.txt
          # Test-only tools (kept out of the runtime image), pinned to the repo's
          # verified versions.
          pip install pytest==8.4.2 httpx==0.28.1
      - name: Run test suite
        # Dataset-gated tests skip (no SWaT CSVs in CI). Golden-vector tests run
        # unchanged; their per-feature-error assertion carries an atol=1e-9 floor
        # that absorbs Intel-vs-AMD FP noise (fixtures are Intel; GitHub runners
        # are AMD EPYC) while the anomaly score/decision stay strict. Root-cause
        # investigation: docs/provenance/phase9_devsecops.md.
        run: python -m pytest -q -rs --durations=10

  # -------------------------------------------------------------- Gate 3: SAST
  sast:
    name: "Gate 3 - SAST (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install "bandit==${BANDIT_VERSION}"
      # Explicit policy: block only genuine, high-confidence risks
      # (severity>=MEDIUM AND confidence>=HIGH). The known B608 (constant-SQL
      # f-strings, values parameterized) and B105 (env-var name) are Low
      # confidence / non-issues and are documented, not globally suppressed.
      - name: bandit (severity>=medium, confidence>=high)
        run: |
          bandit -r backend alerting simulator ml/src \
            --severity-level medium --confidence-level high

  # ------------------------------------------------------- Gate 4: dependencies
  deps:
    name: "Gate 4 - Dependency audit (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      # Audit the pinned PRODUCTION runtime manifest exactly as written
      # (--no-deps: it is already a fully-resolved pin list). We do NOT upgrade
      # or resolve transitively in CI.
      #
      # The 4 torch advisories below are documented, time-bounded exceptions:
      # all require a LOCAL vector (untrusted torch.load / jit.script / lstm_cell),
      # none reachable in this service (immutable trusted model.pt, weights_only,
      # numeric /score input). torch is pinned to 2.9.1 by the golden-vector
      # constraint; fixes (2.10.0/2.13.0) require model re-verification (Phase 10).
      # Any NEW torch (or other) advisory still fails this gate.
      - name: pip-audit (runtime manifest)
        run: |
          pip-audit -r docker/requirements-runtime.txt --no-deps \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2026-2286

  # ----------------------------------------------------------- Gate 5: secrets
  secrets:
    name: "Gate 5 - Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      # Download the pinned gitleaks release binary directly (no third-party
      # action, no license token). Verified against the release checksum.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Save under the exact asset name so `sha256sum -c` (which reads the
          # filename from checksums.txt) can find the file it must verify.
          curl -fsSL "${base}/${asset}" -o "${asset}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "  ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # No custom allowlist: .env.example / documented change-me placeholders are
      # not real credentials and gitleaks does not flag them as such.
      - name: gitleaks detect (full history)
        run: gitleaks detect --source . --no-banner --redact --verbose

  # --------------------------------------------- Gate 6: container build + scan
  container:
    name: "Gate 6 - Docker build + image scan (trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build the REAL backend image from the production Dockerfile. No CI-only
      # Dockerfile, no vulnerability-hiding tricks. The SWaT dataset is excluded
      # by .dockerignore and never enters the build context/layers.
      - name: Build backend image (production Dockerfile)
        run: docker build -f docker/backend.Dockerfile -t ics-guardian-backend:ci .
      # Build the frontend image too (static nginx dashboard) to prove it packs.
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t ics-guardian-frontend:ci .
      # Scan OS packages + application dependencies. Detection stays fully ON
      # (HIGH,CRITICAL). Blocking is limited to FIXABLE findings (--ignore-unfixed):
      # the base-image OS CVEs are overwhelmingly unfixed upstream, so blocking on
      # them would mean disabling detection or forging a base image. The 4
      # documented pip/setuptools-vendored exceptions live in .trivyignore.
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ics-guardian-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table

  # ------------------------------------------------------- Final required gate
  ci-gate:
    name: "DevSecOps gate (all required checks)"
    runs-on: ubuntu-latest
    needs: [lint, tests, sast, deps, secrets, container]
    if: always()
    steps:
      - name: Verify every gate passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "tests=${{ needs.tests.result }}"
          echo "sast=${{ needs.sast.result }}"
          echo "deps=${{ needs.deps.result }}"
          echo "secrets=${{ needs.secrets.result }}"
          echo "container=${{ needs.container.result }}"
          test "${{ needs.lint.result }}" = "success" \
            && test "${{ needs.tests.result }}" = "success" \
            && test "${{ needs.sast.result }}" = "success" \
            && test "${{ needs.deps.result }}" = "success" \
            && test "${{ needs.secrets.result }}" = "success" \
            && test "${{ needs.container.result }}" = "success" \
            || { echo "::error::One or more DevSecOps gates failed"; exit 1; }
          echo "All DevSecOps gates passed."
