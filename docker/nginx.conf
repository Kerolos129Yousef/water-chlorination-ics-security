# Minimal static-serving config for the operator dashboard (Phase 8A).
# Serves index.html only; no proxying (the browser calls the API directly, and
# the backend already allows the localhost:8080 origin via CORS).
server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Lightweight liveness endpoint for the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
