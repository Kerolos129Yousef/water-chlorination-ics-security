# Nginx config for the operator dashboard + API reverse proxy.
#
# Single web entry point (Phase 10B): the browser only ever talks to nginx on
# port 80 (same origin), so no backend port is exposed publicly and no CORS is
# needed. Static dashboard is served from the site root; API calls under /api/
# are proxied to the FastAPI backend over the PRIVATE Docker network.
#
# The backend sees the ORIGINAL paths (the /api/ prefix is stripped), so its
# routes (/health, /status, /score, /alerts, /alerts/active) are unchanged.
server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Lightweight liveness endpoint for the compose/ELB healthcheck (nginx itself).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy: /api/<path>  ->  http://backend:8000/<path>
    # Uses Docker's embedded DNS (127.0.0.11) so a backend container restart is
    # re-resolved instead of being pinned to a stale IP. The /api/ prefix is
    # stripped by the rewrite; query strings are preserved by nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ics_backend backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$ics_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
